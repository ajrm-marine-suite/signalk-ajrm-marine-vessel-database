<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AJRM Marine Vessel Database</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>AJRM Marine Vessel Database</h1>
          <p id="summary">Loading</p>
        </div>
        <div class="actions">
          <input id="filter" type="search" placeholder="Filter vessels" />
          <button id="refresh" type="button">Refresh</button>
          <button id="exportVessels" type="button">Export</button>
          <button id="importVessels" type="button">Import</button>
          <button id="lookupUnknown" type="button">Look up unknown</button>
          <button id="cancelLookup" type="button" hidden>Cancel lookup</button>
          <button id="deleteBite" type="button" class="danger">Delete BITE vessels</button>
          <button id="deleteAll" type="button" class="danger">Delete all</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </header>
      <p id="status" role="status"></p>
      <section id="details" class="details-panel" hidden>
        <div class="details-header">
          <div>
            <h2 id="detailsName">Vessel details</h2>
            <p id="detailsSubtitle"></p>
          </div>
          <div class="details-actions">
            <button id="deleteVessel" type="button" class="danger">Delete vessel</button>
            <button id="closeDetails" type="button" aria-label="Close details">Close</button>
          </div>
        </div>
        <dl id="detailsList"></dl>
      </section>
      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>MMSI</th>
              <th>Category</th>
              <th>Callsign</th>
              <th>Type</th>
              <th>Class</th>
              <th>Length</th>
              <th>Beam</th>
              <th>Last seen</th>
            </tr>
          </thead>
          <tbody id="vessels"></tbody>
        </table>
      </section>
      <dialog id="importDialog">
        <form method="dialog">
          <h2>Import vessel database</h2>
          <p id="importFileSummary"></p>
          <p>
            <strong>Merge</strong> updates vessels in the file and keeps all other stored vessels.
            <strong>Replace</strong> restores exactly the vessels in the file; a server-side backup is
            written first.
          </p>
          <div class="dialog-actions">
            <button id="importMerge" type="button">Merge import</button>
            <button id="importReplace" type="button" class="danger">Replace database</button>
            <button type="submit">Cancel</button>
          </div>
        </form>
      </dialog>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
